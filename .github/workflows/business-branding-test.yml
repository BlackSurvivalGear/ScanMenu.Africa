name: Business branding regression

on:
  pull_request:
    paths:
      - 'js/qr-manager.js'
      - 'tests/business-branding-qr.test.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/qr-manager.js
      - run: node tests/business-branding-qr.test.mjs
